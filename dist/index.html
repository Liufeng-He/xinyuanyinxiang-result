  <details><summary>关于这份心院印象</summary><div class="xr-methods">这份集体印象由本次调查的77份回答共同组成。77份回答中63份来自心理与认知科学学院，不代表全校意见。多选按选择人数计数；各页分母单独标注。画像名称与三维含义依据原问卷项目：亲近/观望、鲜明/潜行、探索/陪伴。课程归并“普心”等明确别名，并拆分多课程回答。引语为匿名原文或连续节选。生活应用中“没有变化”存在与其他选项同时选择的情况，不将其直接解释为“心理学无用”。未使用缺少定义的派生分数作心理测量。来源：survey_responses_rows (1).csv 与问卷源码。</div></details>

      {label:'04 / 实验室体验',title:'43个人，<br>已经走进实验室。',html:'<div class="lab-path"><div><b>26</b><span>游戏感</span></div><i></i><div><b>20</b><span>报酬</span></div><i></i><div><b>19</b><span>反思</span></div><i></i><div><b>18</b><span>好奇结果</span></div></div><p class="xr-lead">他们记住了不同的体验。<br>还有人记住了<br>「最温暖的实验室环境」。</p><p class="xr-note">上列多选以43名参加者为分母。中文为代码语义释义。</p>'},
      {label:'05 / 心理学进入生活',title:'下课以后，<br>心理学去了哪里？',html:'<div class="life-map"><span><b>50</b>理解自己</span><span><b>37</b>理解行为</span><span><b>29</b>改变习惯</span><span><b>28</b>调节情绪</span><span><b>25</b>沟通</span></div><p class="xr-lead">它进入自问、情绪和相处。<br>也有人暂时还没感到变化。</p><p class="xr-note">多选，中文为代码语义释义；选择应用不等于测得实际效果。</p>'},
      {label:'06 / 一个值得停留的反差',title:'愿意安利你，<br>还想多见到你。',html:'<div class="xr-number">28<small>人</small></div><div class="xr-keyword">高推荐 × 低存在感</div><p class="xr-sub">同时给出这两种评分 · 28 / 77</p>'+list([['推荐评分','4—5分'],['存在感评分','1—2分']])+dots(28,77)+'<p class="xr-highlight">你有被喜欢的理由。<br>也有被更多看见的空间。</p><p class="xr-note">逐份核对两道题得到的交叉人数。标题是对数据组合的编辑概括，不是受访者原话，也不表示因果关系。</p>'},
      {label:'07 / 大家关注你的哪一面',title:'说起心院，<br>这些最受关注。',html:'<div class="xr-number">26<small>人</small></div><div class="xr-keyword">科研</div><p class="xr-sub">单选关注重点 · 26 / 77</p>'+list([['人才培养','21人'],['课程','16人'],['服务','7人'],['活动 / 文化','6人 / 1人']])+'<p class="xr-lead">从研究问题，到培养学生，<br>再到一门门具体的课。<br>你的不同侧面，都有人在意。</p><p class="xr-note">本页是单选关注重点；不是对学院资源配置或工作质量的评价。</p>'},

      for(const el of content.querySelectorAll('.xr-kicker,h2,.xr-number,.xr-disc,.xr-sub,.xr-keyword,.xr-list,.xr-personas,.xr-chips,.xr-words,.xr-quote,.message-mist,.xr-lead,.xr-highlight,.xr-note,.word-core,.word-field>span,.persona-viz,.persona-detail,.persona-legend,.course-race,.lab-path,.life-map'))el.dataset.stage=stageOf(el);
      if(index===0){const lead=content.querySelector('.xr-lead'),disc=content.querySelector('.xr-disc'),sub=content.querySelector('.xr-sub');if(lead)lead.dataset.stage=2;if(disc)disc.dataset.stage=3;if(sub)sub.dataset.stage=3;}
      if(index===slides.length-1){const lead=content.querySelector('.xr-lead');if(lead)lead.dataset.stage=2;}
    }
    function render(){content.scrollTop=0;const s=slides[index];sheet.dataset.scene=index;sheet.dataset.step=step;content.innerHTML='<div class="xr-kicker">'+s.label+'</div>'+(s.title?'<h2>'+s.title+'</h2>':'')+s.html;setStages();if(index===2)initPersonaChart();progress.innerHTML=slides.map((_,i)=>'<span class="'+(i<=index?'xr-done':'')+'"></span>').join('');count.textContent=String(index+1).padStart(2,'0')+' / '+slides.length;prev.disabled=index===0;updatePrompt();animateVisible(1);}
    function initPersonaChart(){
      const svg=content.querySelector('.persona-donut');if(!svg)return;let offset=0;
      svg.innerHTML=personaData.map((p,i)=>{const pct=p.value/totalResponses*100,gap=Math.min(.9,pct/3),dash=Math.max(.45,pct-gap),mark='<circle class="persona-slice" data-persona="'+i+'" cx="110" cy="110" r="78" pathLength="100" style="--slice:'+dash+';--offset:'+(-offset)+';--color:'+personaColors[i]+'" tabindex="0" role="button" aria-label="'+p.name+'，'+p.value+'人，'+p.pct+'"></circle>';offset+=pct;return mark;}).join('');
      const select=i=>{const p=personaData[i],art=content.querySelector('.persona-art');content.querySelector('.persona-center strong').textContent=p.pct;content.querySelector('.persona-center span').textContent=p.code+' · '+p.value+'人';content.querySelector('.persona-detail b').textContent=p.name;content.querySelector('.persona-detail span').textContent=p.code+' · '+p.dims;content.querySelector('.persona-detail em').textContent=p.tagline;art.src='assets/personas/'+p.code+'.webp';art.alt=p.name+'人物画像';if(!reducedMotion.matches)art.animate([{opacity:.2,transform:'translateX(20px) scale(.92)'},{opacity:1,transform:'translateX(0) scale(1)'}],{duration:480,easing:'cubic-bezier(.16,1,.3,1)'});content.querySelectorAll('[data-persona]').forEach(el=>el.classList.toggle('is-active',Number(el.dataset.persona)===i));};
      content.querySelectorAll('[data-persona]').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();select(Number(el.dataset.persona));});el.addEventListener('pointerenter',()=>select(Number(el.dataset.persona)));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();select(Number(el.dataset.persona));}});});
    }
    function animateVisible(stage){
      const items=Array.from(content.querySelectorAll('[data-stage="'+stage+'"]'));
      if(stage===2){const number=content.querySelector('.xr-number');if(number)countNumber(number);}
      if(reducedMotion.matches)return;
      items.forEach((el,i)=>el.animate([{opacity:0,transform:el.matches('.xr-number,.xr-disc')?'translateY(44px) scale(.82)':'translateY(28px)',filter:'blur(10px)'},{opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0)'}],{duration:el.matches('.xr-number,.xr-disc')?1050:760,delay:i*120,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'}));
      if(stage===3){
        content.querySelectorAll('.xr-chips i').forEach((el,i)=>el.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1.7)',opacity:1,offset:.62},{transform:'scale(1)',opacity:1}],{duration:520,delay:i*13,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'}));
        content.querySelectorAll('.xr-quote').forEach((el,i)=>el.animate([{opacity:0,transform:'translateX('+(i%2?-34:34)+'px) rotate('+(i%2?2:-2)+'deg)'},{opacity:1,transform:getComputedStyle(el).transform==='none'?'none':getComputedStyle(el).transform}],{duration:720,delay:i*150,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'}));
      }
      const last=items.at(-1);if(last&&content.scrollHeight>content.clientHeight)setTimeout(()=>last.scrollIntoView({block:'nearest',behavior:'smooth'}),420+items.length*80);
    }
    function countNumber(el){
      const node=Array.from(el.childNodes).find(n=>n.nodeType===3&&/[0-9]/.test(n.textContent));if(!node||node.dataset)return;
      const target=parseFloat(node.textContent);if(!Number.isFinite(target)||reducedMotion.matches)return;
      const decimal=node.textContent.includes('.');const start=performance.now();const duration=900;node.textContent='0';
      function tick(now){const t=Math.min(1,(now-start)/duration),v=target*(1-Math.pow(1-t,3));node.textContent=decimal?v.toFixed(1):Math.round(v);if(t<1)requestAnimationFrame(tick);}
      requestAnimationFrame(tick);
    }
    function updatePrompt(){next.textContent=step<4?'轻触屏幕':'下一幕';next.classList.toggle('is-tap',step<4);if(index===slides.length-1&&step===4)next.textContent='再看一次';}
    function advance(){if(busy)return;if(step<4){step++;sheet.dataset.step=step;animateVisible(step);updatePrompt();}else navigate((index+1)%slides.length);}
    async function navigate(target){
      if(busy||target===index)return;
      busy=true;
      const direction=target>index?1:-1;
      try{
        if(!reducedMotion.matches&&content.animate){
          const leaving=content.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX('+(-direction*18)+'px)'}],{duration:180,easing:'ease-in'});
          await leaving.finished.catch(()=>{});
        }
        index=target;step=1;render();
      }finally{busy=false;}
    }
    prev.addEventListener('click',e=>{e.stopPropagation();if(index>0)navigate(index-1);});
    next.addEventListener('click',e=>{e.stopPropagation();advance();});
    sheet.addEventListener('click',e=>{if(e.target.closest('button,details,summary'))return;advance();});
    root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();advance();}if(e.key==='ArrowLeft'){e.preventDefault();navigate(Math.max(0,index-1));}});
    reducedMotion.addEventListener('change',()=>{if(revealObserver)revealObserver.disconnect();for(const animation of content.getAnimations({subtree:true}))animation.cancel();for(const el of content.querySelectorAll('[style]'))el.style.opacity='1';});
    render();
  })();
  </script>
